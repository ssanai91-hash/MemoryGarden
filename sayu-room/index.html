<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사유의 방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 전체화면 3D 공간 + 하단 반투명 조작대. 의도적으로 어두운 단일 테마 */
:root{
  --ink:#050403;            /* 공간의 어둠 */
  --glow:#e8c7a4;           /* 벽 상단 조명빛 */
  --paper:#efe4d6;          /* 글자 */
  --dim:#9c8b79;            /* 보조 글자 */
  --veil:rgba(14,10,8,.62); /* 조작대 바탕 */
  --line:rgba(232,199,164,.22);
  --f-title:"Nanum Myeongjo","Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* 입장 화면 */
#gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  background:radial-gradient(ellipse at 50% 60%,rgba(60,38,26,.55),var(--ink) 70%);transition:opacity 2.2s ease}
#gate.gone{opacity:0;pointer-events:none}
.plaque{display:flex;gap:18px;align-items:stretch;padding:26px 22px;border:1px solid var(--line);background:rgba(20,16,13,.7)}
.plaque .ko{writing-mode:vertical-rl;font-family:var(--f-title);font-size:44px;letter-spacing:.32em;color:var(--glow);line-height:1}
.plaque .rule{width:1px;background:linear-gradient(var(--glow),transparent)}
.plaque .en{writing-mode:vertical-rl;font-family:var(--f-title);font-size:13px;letter-spacing:.18em;color:var(--dim)}
#gate p{margin:0;max-width:30ch;text-align:center;color:var(--dim);font-size:14px;line-height:1.8;text-wrap:balance}
.btn{font:inherit;color:var(--paper);background:transparent;border:1px solid var(--line);padding:12px 26px;letter-spacing:.2em;cursor:pointer;transition:background .3s,border-color .3s}
.btn:hover,.btn:focus-visible{background:rgba(232,199,164,.08);border-color:var(--glow);outline:none}

/* 안내 */
#hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);text-align:center;font-size:12.5px;letter-spacing:.08em;color:var(--dim);
  transition:opacity 1.2s;pointer-events:none;padding-inline:16px}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-title);font-size:20px;letter-spacing:.3em;color:var(--glow);
  opacity:0;transition:opacity 1.4s;pointer-events:none;text-align:center;white-space:nowrap}

/* 하단 조작대 */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px));
  transition:opacity 1.2s}
#bar .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:var(--veil);border:1px solid var(--line);padding:6px;backdrop-filter:blur(6px)}
#bar button{font:inherit;font-size:14px;color:var(--paper);background:transparent;border:0;padding:10px 14px;min-width:58px;cursor:pointer;letter-spacing:.06em}
#bar button:focus-visible{outline:1px solid var(--glow)}
#bar button:active{background:rgba(232,199,164,.1)}
#bar button[aria-pressed="false"]{color:var(--dim)}
.sep{width:1px;background:var(--line);margin:6px 2px}

/* 걷기 패드 */
#pad{position:fixed;z-index:5;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 86px);display:flex;flex-direction:column;gap:6px;transition:opacity 1.2s}
#pad button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--veil);color:var(--paper);font-size:16px;cursor:pointer;touch-action:none}
#pad button:active{border-color:var(--glow)}

/* 명상 */
#medi{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 9vh);gap:14px;pointer-events:none;opacity:0;transition:opacity 2s}
#medi.on{opacity:1;pointer-events:auto}
#breath{font-family:var(--f-title);font-size:17px;letter-spacing:.5em;color:var(--glow);transition:opacity 1.5s}
#remain{font-size:12px;color:var(--dim);letter-spacing:.2em;font-variant-numeric:tabular-nums}
#medi .stop{opacity:0;transition:opacity .8s}
#medi.reveal .stop{opacity:1}

/* 명상 시간 선택 */
#pick{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;background:rgba(5,4,3,.55)}
#pick .box{display:flex;flex-direction:column;gap:18px;align-items:center;padding:26px 22px;background:rgba(20,16,13,.88);border:1px solid var(--line)}
#pick h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:18px;letter-spacing:.3em;color:var(--glow)}
#pick .opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#pick small{color:var(--dim);font-size:12px}
@media (prefers-reduced-motion:reduce){#gate,#hint,#toast,#bar,#medi{transition:none}}
</style>
</head>
<body>

<canvas id="c" aria-label="사유의 방 3D 공간"></canvas>

<div id="gate">
  <div class="plaque" aria-hidden="true"><span class="ko">사유의방</span><span class="rule"></span><span class="en">A Room of Quiet Contemplation</span></div>
  <p>어두운 방, 별빛 아래 두 반가사유상이 앉아 있습니다. 소리를 켜고 천천히 들어오세요.</p>
  <button class="btn" id="enter">고요히 들어가기</button>
</div>

<div id="hint">끌어서 둘러보기 · 불상을 누르면 그 앞으로 걸어갑니다</div>
<div id="toast"></div>

<div id="pad" hidden>
  <button id="fw" aria-label="앞으로 걷기">▲</button>
  <button id="bw" aria-label="뒤로 걷기">▼</button>
</div>

<div id="bar" hidden>
  <div class="row">
    <button id="bBow">절하기</button>
    <button id="bBow3">삼배</button>
    <span class="sep"></span>
    <button id="bMed">명상</button>
    <span class="sep"></span>
    <button id="bSnd" aria-pressed="true">소리</button>
  </div>
</div>

<div id="pick" hidden>
  <div class="box">
    <h2>명상</h2>
    <div class="opts">
      <button class="btn" data-min="3">3분</button>
      <button class="btn" data-min="10">10분</button>
      <button class="btn" data-min="20">20분</button>
    </div>
    <small>들숨 4초 · 날숨 6초에 맞춰 별빛이 숨 쉽니다</small>
    <button class="btn" id="pickCancel" style="border:0;font-size:13px;color:var(--dim)">돌아가기</button>
  </div>
</div>

<div id="medi">
  <div id="breath">들이쉬고</div>
  <div id="remain"></div>
  <button class="btn stop" id="mStop">명상 마치기</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030202);
const camera=new THREE.PerspectiveCamera(62,1,0.05,60);

const R=9, WALL_H=4.2;

/* ---------- 벽: 위로 갈수록 따뜻하게 밝아지는 곡면 ---------- */
const wallMat=new THREE.ShaderMaterial({
  side:THREE.BackSide,
  uniforms:{uGlow:{value:1}},
  vertexShader:`varying vec2 vUv;varying vec3 vP;void main(){vUv=uv;vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec2 vUv;varying vec3 vP;uniform float uGlow;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
  void main(){
    float y=vUv.y;
    vec3 low=vec3(.035,.022,.016), mid=vec3(.30,.17,.115), top=vec3(.96,.74,.56);
    vec3 c=mix(low,mid,smoothstep(.05,.78,y));
    c=mix(c,top,smoothstep(.70,.985,y)*uGlow);
    float plaster=n(vec2(atan(vP.z,vP.x)*60.,vP.y*14.))*.5+n(vec2(atan(vP.z,vP.x)*220.,vP.y*50.))*.5;
    c*=.9+.16*plaster;
    gl_FragColor=vec4(c,1.);
  }`
});
const wall=new THREE.Mesh(new THREE.CylinderGeometry(R,R,WALL_H,128,1,true),wallMat);
wall.position.y=WALL_H/2; scene.add(wall);

/* ---------- 천장: 어둠 + 별 ---------- */
const ceil=new THREE.Mesh(new THREE.CircleGeometry(R+.1,96),new THREE.MeshBasicMaterial({color:0x040303}));
ceil.rotation.x=Math.PI/2; ceil.position.y=WALL_H+.02; scene.add(ceil);
// 천장 가장자리 띠(조명 몰딩)
const band=new THREE.Mesh(new THREE.CylinderGeometry(R-.02,R-.02,.18,128,1,true),new THREE.MeshBasicMaterial({color:0x0a0706,side:THREE.BackSide}));
band.position.y=WALL_H-.06; scene.add(band);

const STAR_N=5200;
const sp=new Float32Array(STAR_N*3), sPh=new Float32Array(STAR_N), sSz=new Float32Array(STAR_N), sSp=new Float32Array(STAR_N);
for(let i=0;i<STAR_N;i++){
  const r=Math.sqrt(Math.random())*(R-.25), a=Math.random()*Math.PI*2;
  sp[i*3]=Math.cos(a)*r; sp[i*3+1]=WALL_H-.01-Math.random()*.05; sp[i*3+2]=Math.sin(a)*r;
  sPh[i]=Math.random()*6.283; sSp[i]=.25+Math.random()*1.1;
  sSz[i]=Math.random()<.035? 2.6+Math.random()*1.6 : .9+Math.random()*.9;
}
const sg=new THREE.BufferGeometry();
sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
sg.setAttribute('aPh',new THREE.BufferAttribute(sPh,1));
sg.setAttribute('aSz',new THREE.BufferAttribute(sSz,1));
sg.setAttribute('aSp',new THREE.BufferAttribute(sSp,1));
const starMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uT:{value:0},uB:{value:1},uPR:{value:renderer.getPixelRatio()}},
  vertexShader:`attribute float aPh;attribute float aSz;attribute float aSp;uniform float uT;uniform float uPR;varying float vA;
  void main(){vec4 mv=modelViewMatrix*vec4(position,1.);
    float tw=.5+.5*sin(uT*aSp+aPh); vA=.25+.75*tw*tw;
    gl_PointSize=max(1.2,aSz*uPR*(2.2/max(.5,-mv.z))*2.2);
    gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying float vA;uniform float uB;
  void main(){vec2 d=gl_PointCoord-.5;float r=length(d);float a=smoothstep(.5,.0,r);
    gl_FragColor=vec4(vec3(1.,.93,.82)*a*vA*uB,a*vA*uB);}`
});
scene.add(new THREE.Points(sg,starMat));

/* ---------- 바닥과 낮은 원형 단 ---------- */
const floor=new THREE.Mesh(new THREE.CircleGeometry(R,96),new THREE.MeshStandardMaterial({color:0x16110e,roughness:.92,metalness:0}));
floor.rotation.x=-Math.PI/2; scene.add(floor);
const plat=new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.25,.1,96),new THREE.MeshStandardMaterial({color:0x2a1f18,roughness:.55,metalness:.05}));
plat.scale.x=1.28; plat.position.set(0,.05,-.6); scene.add(plat);
// 단 둘레 바닥의 은은한 빛
const ringGeo=new THREE.TorusGeometry(4.55,.012,6,160);
const ring=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:0x5f6a6e}));
ring.rotation.x=Math.PI/2; ring.scale.x=1.26; ring.position.set(0,.012,-.6); scene.add(ring);
const haloMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec2 vUv;void main(){float d=abs(vUv.y-.5)*2.;float a=pow(1.-d,3.)*.22;gl_FragColor=vec4(.55,.6,.62,a);}`});
const halo=new THREE.Mesh(new THREE.RingGeometry(4.35,4.85,160,1),haloMat);
// RingGeometry uv는 원형이라 직접 반경 기반으로 다시 계산
(function(){const p=halo.geometry.attributes.position,uv=halo.geometry.attributes.uv;for(let i=0;i<p.count;i++){const r=Math.hypot(p.getX(i),p.getY(i));uv.setY(i,(r-4.35)/.5);}uv.needsUpdate=true;})();
halo.rotation.x=-Math.PI/2; halo.scale.x=1.26; halo.position.set(0,.008,-.6); scene.add(halo);

/* ---------- 조명 ---------- */
scene.add(new THREE.AmbientLight(0x2a1d16,.55));
for(let i=0;i<6;i++){const a=i/6*Math.PI*2;const l=new THREE.PointLight(0xffb27a,.42,15,2);l.position.set(Math.cos(a)*(R-1.2),WALL_H-.5,Math.sin(a)*(R-1.2));scene.add(l);}

/* ---------- 반가사유상 (임시 형상: 실제 3D 스캔으로 교체 예정) ---------- */
function bronze(c,rough){return new THREE.MeshStandardMaterial({color:c,metalness:.62,roughness:rough});}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function limb(a,b,r1,r2,mat,g){const d=new THREE.Vector3().subVectors(b,a);const len=d.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,len,20,1),mat);
  m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(V(0,1,0),d.clone().normalize());g.add(m);
  const j=new THREE.Mesh(new THREE.SphereGeometry(r2,16,12),mat);j.position.copy(b);g.add(j);return m;}
function lathe(pts,mat,seg){return new THREE.Mesh(new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg||48),mat);}

function statue(kind){
  // kind 0: 낮은 삼산관, 상반신 나신 / kind 1: 높은 화려한 보관, 어깨 천의
  const g=new THREE.Group();
  const M=bronze(kind===0?0x7a6646:0x5a5440,kind===0?.38:.5);
  const D=bronze(kind===0?0x5e4c34:0x47443a,.55);
  // 연꽃 대좌와 둥근 의자
  const lotus=lathe([[0,0],[.2,0],[.23,.03],[.2,.05],[0,.05]],D);g.add(lotus);
  const stool=lathe([[0,.05],[.15,.05],[.12,.18],[.13,.3],[.165,.37],[.15,.39],[0,.39]],D);g.add(stool);
  // 의자를 덮어 흘러내리는 옷자락
  const drape=lathe([[.12,.07],[.215,.09],[.2,.2],[.185,.32],[.17,.4],[0,.42]],M,56);drape.scale.z=.85;g.add(drape);
  for(let i=0;i<7;i++){const a=-1.2+i*.4;const f=new THREE.Mesh(new THREE.BoxGeometry(.012,.26,.03),D);f.position.set(Math.sin(a)*.205,.22,Math.cos(a)*.18);f.rotation.y=a;g.add(f);}
  // 엉덩이·허리
  const hip=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),M);hip.scale.set(.15,.075,.12);hip.position.set(0,.44,0);g.add(hip);
  // 몸통: 가늘고 약간 앞으로 숙임
  const torso=new THREE.Group();torso.position.set(0,.45,0);torso.rotation.x=.16;g.add(torso);
  const body=lathe([[.0,0],[.105,0],[.085,.08],[.08,.16],[.1,.24],[.095,.28],[.045,.31],[0,.31]],M,40);body.scale.z=.72;torso.add(body);
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(.03,.034,.06,16),M);neck.position.y=.33;torso.add(neck);
  if(kind===0){const nl=new THREE.Mesh(new THREE.TorusGeometry(.065,.006,6,32,Math.PI),M);nl.rotation.set(Math.PI/2+.25,0,Math.PI);nl.position.set(0,.29,.025);nl.scale.y=.9;torso.add(nl);}
  // 머리: 고개를 살짝 숙임
  const head=new THREE.Group();head.position.set(0,.4,.01);head.rotation.x=.22;torso.add(head);
  const skull=new THREE.Mesh(new THREE.SphereGeometry(.066,28,22),M);skull.scale.set(.92,1.12,.98);head.add(skull);
  const nose=new THREE.Mesh(new THREE.ConeGeometry(.011,.03,8),M);nose.rotation.x=Math.PI/2;nose.position.set(0,-.005,.066);head.add(nose);
  for(const s of [-1,1]){const ear=new THREE.Mesh(new THREE.CylinderGeometry(.012,.01,.07,8),M);ear.position.set(s*.063,-.02,0);head.add(ear);}
  if(kind===0){
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(.05,.06,.035,24),M);cap.position.y=.07;head.add(cap);
    for(const x of [-.045,0,.045]){const p=new THREE.Mesh(new THREE.SphereGeometry(.028,16,10,0,Math.PI*2,0,Math.PI/2),M);p.scale.set(1,.9,.6);p.position.set(x,.085,0);head.add(p);}
  }else{
    const band=new THREE.Mesh(new THREE.CylinderGeometry(.064,.066,.03,24),D);band.position.y=.06;head.add(band);
    for(let i=0;i<9;i++){const a=(i/9)*Math.PI*2;const c=new THREE.Mesh(new THREE.ConeGeometry(.016,.07+(i%3===0?.05:0),6),M);c.position.set(Math.sin(a)*.055,.11,Math.cos(a)*.055);head.add(c);}
    const top=new THREE.Mesh(new THREE.CylinderGeometry(.03,.045,.08,16),M);top.position.y=.11;head.add(top);
    for(const s of [-1,1]){const rib=new THREE.Mesh(new THREE.BoxGeometry(.012,.12,.02),D);rib.position.set(s*.07,.01,-.01);rib.rotation.z=s*.15;head.add(rib);}
  }
  // 다리: 오른다리를 왼무릎 위에 올린 반가 자세 (상은 +z를 바라봄, 상의 오른쪽 = -x)
  const hipR=V(-.07,.45,.02), kneeR=V(-.24,.47,.15), ankleR=V(.08,.48,.18);
  limb(hipR,kneeR,.065,.055,M,g); limb(kneeR,ankleR,.05,.035,M,g);
  const footR=new THREE.Mesh(new THREE.BoxGeometry(.05,.03,.1),M);footR.position.set(.12,.47,.19);footR.rotation.y=-.6;g.add(footR);
  const hipL=V(.07,.44,.03), kneeL=V(.1,.42,.22), ankleL=V(.11,.08,.26);
  limb(hipL,kneeL,.065,.058,M,g);
  const shin=limb(kneeL,ankleL,.07,.06,M,g); // 옷자락에 덮인 정강이
  const footL=new THREE.Mesh(new THREE.BoxGeometry(.055,.03,.11),M);footL.position.set(.11,.07,.29);g.add(footL);
  // 팔: 오른팔꿈치를 무릎에 대고 손끝을 뺨에
  const T=v=>torso.localToWorld(v.clone());
  torso.updateMatrixWorld(true);g.updateMatrixWorld(true);
  const shR=T(V(-.105,.26,0)), shL=T(V(.105,.26,0));
  const elbR=V(-.2,.53,.13), handR=V(-.05,.84,.135);
  limb(shR,elbR,.033,.028,M,g); limb(elbR,handR,.028,.022,M,g);
  for(let i=0;i<3;i++){const f=new THREE.Mesh(new THREE.CylinderGeometry(.006,.007,.045,8),M);f.position.set(-.04+i*.01,.875,.14-i*.004);f.rotation.z=-.2;g.add(f);}
  const elbL=V(.15,.55,.06), handL=V(.08,.5,.2);
  limb(shL,elbL,.033,.028,M,g); limb(elbL,handL,.027,.024,M,g);
  const palmL=new THREE.Mesh(new THREE.BoxGeometry(.05,.015,.07),M);palmL.position.set(.07,.5,.22);g.add(palmL);
  if(kind===1){ // 천의 자락
    for(const s of [-1,1]){limb(T(V(s*.11,.27,-.02)),V(s*.2,.2,-.05),.012,.02,D,g);limb(V(s*.2,.2,-.05),V(s*.24,.02,-.02),.02,.035,D,g);}
  }
  g.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false;}});
  g.scale.setScalar(1.05);
  return g;
}

const statues=[];
function place(kind,x,z){
  const grp=new THREE.Group();grp.position.set(x,0,z);
  const ped=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,1.12,48),new THREE.MeshStandardMaterial({color:0x0b0908,roughness:.75}));
  ped.position.y=.1+.56;grp.add(ped);
  const s=statue(kind);s.position.y=1.22;grp.add(s);
  scene.add(grp);
  const spot=new THREE.SpotLight(0xffeedd,3.4,10,.32,.65,1);
  spot.position.set(x*.6,WALL_H-.1,z+2.4);spot.target.position.set(x,1.75,z);scene.add(spot,spot.target);
  const back=new THREE.SpotLight(0xffc690,1.1,8,.45,.8,1.2);
  back.position.set(x*1.4,WALL_H-.2,z-3);back.target.position.set(x,1.6,z);scene.add(back,back.target);
  statues.push({grp,x,z});
}
place(1,-1.75,-.75);   // 왼쪽: 높은 보관
place(0, 1.75,-.75);   // 오른쪽: 삼산관

/* ---------- 시점 ---------- */
const st={x:0,z:8.2,eye:1.6,yaw:0,pitch:.05};
let locked=true;
function applyCam(){
  camera.position.set(st.x,st.eye,st.z);
  const cp=Math.cos(st.pitch);
  camera.lookAt(st.x-Math.sin(st.yaw)*cp,st.eye+Math.sin(st.pitch),st.z-Math.cos(st.yaw)*cp);
}
function clampPos(){
  const d=Math.hypot(st.x,st.z);if(d>R-.9){st.x*=(R-.9)/d;st.z*=(R-.9)/d;}
  for(const s of statues){const dx=st.x-s.x,dz=st.z-s.z,dd=Math.hypot(dx,dz);if(dd<1.15){st.x=s.x+dx/dd*1.15;st.z=s.z+dz/dd*1.15;}}
}

/* 트윈 */
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const tweens=[];
function tween(props,dur){return new Promise(res=>{const from={};for(const k in props)from[k]=st[k];
  if('yaw' in props){let d=props.yaw-from.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));props.yaw=from.yaw+d;}
  tweens.push({from,props,dur,t:0,res});});}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* 끌어서 둘러보기 / 탭으로 다가가기 */
let drag=null;
canvas.addEventListener('pointerdown',e=>{if(locked)return;drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;
  const k=2.6/Math.max(innerWidth,innerHeight);
  st.yaw+=(e.clientX-drag.x)*k; st.pitch=Math.max(-1.2,Math.min(1.1,st.pitch+(e.clientY-drag.y)*k));
  drag.x=e.clientX;drag.y=e.clientY;});
canvas.addEventListener('pointerup',e=>{if(!drag)return;const moved=Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy);drag=null;if(moved<8)pick(e);});
canvas.addEventListener('pointercancel',()=>drag=null);
const ray=new THREE.Raycaster();
function pick(e){
  const r=canvas.getBoundingClientRect();
  ray.setFromCamera({x:((e.clientX-r.left)/r.width)*2-1,y:-((e.clientY-r.top)/r.height)*2+1},camera);
  for(const s of statues){if(ray.intersectObject(s.grp,true).length){approach(s);return;}}
}
async function approach(s){
  locked=true;
  const tx=s.x,tz=s.z+2.1;
  const yaw0=Math.atan2(-(tx-st.x),-(tz-st.z));
  const dist=Math.hypot(tx-st.x,tz-st.z);
  if(dist>.3){await tween({yaw:yaw0,pitch:0},.9);await tween({x:tx,z:tz},Math.max(1.4,dist*.75));}
  await tween({yaw:0,pitch:Math.atan2(2.05-st.eye,2.1)},1.3);
  locked=false;
}

/* 걷기 */
const keys={};let padDir=0;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
for(const [id,dir] of [['#fw',1],['#bw',-1]]){const b=$(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();padDir=dir;b.setPointerCapture(e.pointerId);});
  for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>{padDir=0;});}

/* ---------- 소리: 싱잉볼과 낮은 울림 ---------- */
let ac=null,master=null,droneGain=null,soundOn=true;
function initAudio(){
  try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=ac.createGain();master.gain.value=.9;master.connect(ac.destination);
  // 잔향
  const conv=ac.createConvolver();const len=ac.sampleRate*4.5,ir=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  conv.buffer=ir;const wet=ac.createGain();wet.gain.value=.35;conv.connect(wet);wet.connect(master);
  ac._rev=conv;
  // 공간의 낮은 울림
  droneGain=ac.createGain();droneGain.gain.value=0;droneGain.connect(master);droneGain.connect(conv);
  for(const [f,v] of [[55,.05],[82.4,.03],[110.2,.012]]){const o=ac.createOscillator();o.frequency.value=f;const g=ac.createGain();g.gain.value=v;
    const lfo=ac.createOscillator();lfo.frequency.value=.05+Math.random()*.05;const lg=ac.createGain();lg.gain.value=v*.6;lfo.connect(lg);lg.connect(g.gain);
    o.connect(g);g.connect(droneGain);o.start();lfo.start();}
  // 공기 소리
  const nb=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate),nd=nb.getChannelData(0);let last=0;
  for(let i=0;i<nd.length;i++){last=(last+.02*(Math.random()*2-1))/1.02;nd[i]=last*3;}
  const ns=ac.createBufferSource();ns.buffer=nb;ns.loop=true;const nf=ac.createBiquadFilter();nf.type='lowpass';nf.frequency.value=380;
  const ngn=ac.createGain();ngn.gain.value=.05;ns.connect(nf);nf.connect(ngn);ngn.connect(droneGain);ns.start();
  droneGain.gain.linearRampToValueAtTime(1,ac.currentTime+6);
}
function bowl(vol=1,base=196){
  if(!ac||!soundOn)return;const t=ac.currentTime;
  const parts=[[1,1,9],[2.71,.5,6.5],[5.15,.22,4],[8.1,.1,2.6],[1.003,.6,9]];
  for(const [m,a,dec] of parts){const o=ac.createOscillator();o.type='sine';o.frequency.value=base*m;
    const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12*a*vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dec);
    o.connect(g);g.connect(master);g.connect(ac._rev);o.start(t);o.stop(t+dec+.1);}
}
function knock(){ // 절할 때 바닥에 닿는 작은 목탁 소리
  if(!ac||!soundOn)return;const t=ac.currentTime;const o=ac.createOscillator();o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(260,t+.12);
  const g=ac.createGain();g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(g);g.connect(master);g.connect(ac._rev);o.start(t);o.stop(t+.4);}

/* ---------- 연출 ---------- */
function toast(txt,ms=2600){const el=$('#toast');el.textContent=txt;el.style.opacity=1;clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.opacity=0,ms);}
function showUI(v){for(const id of ['#bar','#pad','#hint'])$(id).style.opacity=v?1:0;$('#bar').style.pointerEvents=v?'auto':'none';$('#pad').style.pointerEvents=v?'auto':'none';}

async function bowOnce(){
  const p0=st.pitch;
  await tween({eye:1.05,pitch:-.1},1.5);
  await tween({eye:.55,pitch:-1.05},1.8);
  knock();
  await wait(1500);
  await tween({eye:1.0,pitch:-.25},1.5);
  await tween({eye:1.6,pitch:p0},1.5);
}
async function bow(n){
  if(locked)return;locked=true;showUI(false);
  for(let i=0;i<n;i++){if(n>1)toast(['일배','이배','삼배'][i],2000);await bowOnce();await wait(400);}
  bowl(.7);locked=false;showUI(true);
}

/* 명상 */
let med=null;let wakeLock=null;
async function startMed(min){
  $('#pick').hidden=true;locked=true;showUI(false);
  try{wakeLock=await navigator.wakeLock?.request('screen');}catch(e){}
  bowl(1);
  med={end:performance.now()+min*60000,start:performance.now()};
  $('#medi').classList.add('on');
}
async function endMed(done){
  if(!med)return;med=null;$('#medi').classList.remove('on','reveal');
  try{wakeLock&&wakeLock.release();}catch(e){}wakeLock=null;
  starMat.uniforms.uB.value=1;
  if(done){bowl(.9);await wait(2600);bowl(.8,174.6);await wait(2600);bowl(1);toast('명상을 마쳤습니다',3500);}
  locked=false;showUI(true);
}
$('#medi').addEventListener('pointerdown',e=>{if(e.target.id==='mStop')return;$('#medi').classList.add('reveal');clearTimeout(endMed._t);endMed._t=setTimeout(()=>$('#medi').classList.remove('reveal'),3500);});
$('#mStop').addEventListener('click',()=>endMed(false));

/* 버튼 */
$('#bBow').addEventListener('click',()=>bow(1));
$('#bBow3').addEventListener('click',()=>bow(3));
$('#bMed').addEventListener('click',()=>{if(!locked)$('#pick').hidden=false;});
$('#pickCancel').addEventListener('click',()=>$('#pick').hidden=true);
document.querySelectorAll('#pick [data-min]').forEach(b=>b.addEventListener('click',()=>startMed(+b.dataset.min)));
$('#bSnd').addEventListener('click',()=>{soundOn=!soundOn;$('#bSnd').setAttribute('aria-pressed',soundOn);
  if(droneGain)droneGain.gain.linearRampToValueAtTime(soundOn?1:0,ac.currentTime+1.5);});

/* 입장 */
$('#enter').addEventListener('click',async()=>{
  initAudio();if(ac&&ac.state==='suspended')ac.resume();
  $('#gate').classList.add('gone');
  setTimeout(()=>bowl(.8),1600);
  await tween({z:5.4,pitch:.12},6.5);
  locked=false;$('#bar').hidden=false;$('#pad').hidden=false;showUI(true);
  setTimeout(()=>$('#hint').style.opacity=0,9000);
});
$('#hint').style.opacity=0;

/* ---------- 루프 ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?72:60;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];tw.t+=dt/tw.dur;const k=ease(Math.min(1,tw.t));
    for(const p in tw.props)st[p]=tw.from[p]+(tw.props[p]-tw.from[p])*k;
    if(tw.t>=1){tweens.splice(i,1);tw.res();}}
  if(!locked){
    let mv=padDir;if(keys['w']||keys['arrowup'])mv=1;if(keys['s']||keys['arrowdown'])mv=-1;
    if(keys['a']||keys['arrowleft'])st.yaw+=dt*1.2;if(keys['d']||keys['arrowright'])st.yaw-=dt*1.2;
    if(mv){st.x-=Math.sin(st.yaw)*mv*dt*1.1;st.z-=Math.cos(st.yaw)*mv*dt*1.1;clampPos();}
  }
  starMat.uniforms.uT.value=now/1000;
  if(med){
    const el=(now-med.start)/1000,cyc=el%10,inhale=cyc<4;
    const br=inhale?cyc/4:1-(cyc-4)/6;
    starMat.uniforms.uB.value=.55+.75*ease(br);
    const b=$('#breath');const want=inhale?'들이쉬고':'내쉬고';if(b.textContent!==want)b.textContent=want;
    const left=Math.max(0,med.end-now);const m=Math.floor(left/60000),s=Math.floor(left/1000)%60;
    $('#remain').textContent=m+':'+String(s).padStart(2,'0');
    if(left<=0)endMed(true);
  }
  applyCam();renderer.render(scene,camera);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
