<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사유의 방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="experience.css">
</head>
<body>

<canvas id="c" aria-label="사유의 방 3D 공간"></canvas>

<div id="gate">
  <div class="plaque" aria-hidden="true"><span class="ko">사유의방</span><span class="rule"></span><span class="en">A Room of Quiet Contemplation</span></div>
  <p>어두운 방, 별빛 아래 두 반가사유상이 앉아 있습니다. 소리를 켜고 천천히 들어오세요.</p>
  <button class="btn" id="enter">고요히 들어가기</button>
</div>

<div id="hint">끌어서 둘러보기 · 불상을 누르면 그 앞으로 걸어갑니다</div>
<div id="toast"></div>

<div id="pad" hidden>
  <button id="fw" aria-label="앞으로 걷기">▲</button>
  <button id="bw" aria-label="뒤로 걷기">▼</button>
</div>

<div id="bar" hidden>
  <div class="row">
    <button id="bBow">절하기</button>
    <button id="bBow3">삼배</button>
    <span class="sep"></span>
    <button id="bMed">명상</button>
    <span class="sep"></span>
    <button id="bSnd" aria-pressed="true">소리</button>
  </div>
</div>

<div id="pick" hidden>
  <div class="box">
    <h2>명상</h2>
    <div class="opts">
      <button class="btn" data-min="3">3분</button>
      <button class="btn" data-min="10">10분</button>
      <button class="btn" data-min="20">20분</button>
    </div>
    <small>들숨 4초 · 날숨 6초에 맞춰 별빛이 숨 쉽니다</small>
    <button class="btn" id="pickCancel" style="border:0;font-size:13px;color:var(--dim)">돌아가기</button>
  </div>
</div>

<div id="medi">
  <div id="breath">들이쉬고</div>
  <div id="remain"></div>
  <button class="btn stop" id="mStop">명상 마치기</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="experience.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030202);
const camera=new THREE.PerspectiveCamera(62,1,0.05,60);

const R=9, WALL_H=4.2;

/* ---------- 벽: 위로 갈수록 따뜻하게 밝아지는 곡면 ---------- */
const wallMat=new THREE.ShaderMaterial({
  side:THREE.BackSide,
  uniforms:{uGlow:{value:1}},
  vertexShader:`varying vec2 vUv;varying vec3 vP;void main(){vUv=uv;vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec2 vUv;varying vec3 vP;uniform float uGlow;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
  void main(){
    float y=vUv.y;
    vec3 low=vec3(.035,.022,.016), mid=vec3(.30,.17,.115), top=vec3(.96,.74,.56);
    vec3 c=mix(low,mid,smoothstep(.05,.78,y));
    c=mix(c,top,smoothstep(.70,.985,y)*uGlow);
    float plaster=n(vec2(atan(vP.z,vP.x)*60.,vP.y*14.))*.5+n(vec2(atan(vP.z,vP.x)*220.,vP.y*50.))*.5;
    c*=.9+.16*plaster;
    gl_FragColor=vec4(c,1.);
  }`
});
const wall=new THREE.Mesh(new THREE.CylinderGeometry(R,R,WALL_H,128,1,true),wallMat);
wall.position.y=WALL_H/2; scene.add(wall);

/* ---------- 천장: 어둠 + 별 ---------- */
const ceil=new THREE.Mesh(new THREE.CircleGeometry(R+.1,96),new THREE.MeshBasicMaterial({color:0x040303}));
ceil.rotation.x=Math.PI/2; ceil.position.y=WALL_H+.02; scene.add(ceil);
// 천장 가장자리 띠(조명 몰딩)
const band=new THREE.Mesh(new THREE.CylinderGeometry(R-.02,R-.02,.18,128,1,true),new THREE.MeshBasicMaterial({color:0x0a0706,side:THREE.BackSide}));
band.position.y=WALL_H-.06; scene.add(band);

const STAR_N=5200;
const sp=new Float32Array(STAR_N*3), sPh=new Float32Array(STAR_N), sSz=new Float32Array(STAR_N), sSp=new Float32Array(STAR_N);
for(let i=0;i<STAR_N;i++){
  const r=Math.sqrt(Math.random())*(R-.25), a=Math.random()*Math.PI*2;
  sp[i*3]=Math.cos(a)*r; sp[i*3+1]=WALL_H-.01-Math.random()*.05; sp[i*3+2]=Math.sin(a)*r;
  sPh[i]=Math.random()*6.283; sSp[i]=.25+Math.random()*1.1;
  sSz[i]=Math.random()<.035? 2.6+Math.random()*1.6 : .9+Math.random()*.9;
}
const sg=new THREE.BufferGeometry();
sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
sg.setAttribute('aPh',new THREE.BufferAttribute(sPh,1));
sg.setAttribute('aSz',new THREE.BufferAttribute(sSz,1));
sg.setAttribute('aSp',new THREE.BufferAttribute(sSp,1));
const starMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uT:{value:0},uB:{value:1},uPR:{value:renderer.getPixelRatio()}},
  vertexShader:`attribute float aPh;attribute float aSz;attribute float aSp;uniform float uT;uniform float uPR;varying float vA;
  void main(){vec4 mv=modelViewMatrix*vec4(position,1.);
    float tw=.5+.5*sin(uT*aSp+aPh); vA=.25+.75*tw*tw;
    gl_PointSize=max(1.2,aSz*uPR*(2.2/max(.5,-mv.z))*2.2);
    gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying float vA;uniform float uB;
  void main(){vec2 d=gl_PointCoord-.5;float r=length(d);float a=smoothstep(.5,.0,r);
    gl_FragColor=vec4(vec3(1.,.93,.82)*a*vA*uB,a*vA*uB);}`
});
scene.add(new THREE.Points(sg,starMat));

/* ---------- 바닥과 낮은 원형 단 ---------- */
const floor=new THREE.Mesh(new THREE.CircleGeometry(R,96),new THREE.MeshStandardMaterial({color:0x16110e,roughness:.92,metalness:0}));
floor.rotation.x=-Math.PI/2; scene.add(floor);
const plat=new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.25,.1,96),new THREE.MeshStandardMaterial({color:0x2a1f18,roughness:.55,metalness:.05}));
plat.scale.x=1.28; plat.position.set(0,.05,-.6); scene.add(plat);
// 단 둘레 바닥의 은은한 빛
const ringGeo=new THREE.TorusGeometry(4.55,.012,6,160);
const ring=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:0x5f6a6e}));
ring.rotation.x=Math.PI/2; ring.scale.x=1.26; ring.position.set(0,.012,-.6); scene.add(ring);
const haloMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec2 vUv;void main(){float d=abs(vUv.y-.5)*2.;float a=pow(1.-d,3.)*.22;gl_FragColor=vec4(.55,.6,.62,a);}`});
const halo=new THREE.Mesh(new THREE.RingGeometry(4.35,4.85,160,1),haloMat);
// RingGeometry uv는 원형이라 직접 반경 기반으로 다시 계산
(function(){const p=halo.geometry.attributes.position,uv=halo.geometry.attributes.uv;for(let i=0;i<p.count;i++){const r=Math.hypot(p.getX(i),p.getY(i));uv.setY(i,(r-4.35)/.5);}uv.needsUpdate=true;})();
halo.rotation.x=-Math.PI/2; halo.scale.x=1.26; halo.position.set(0,.008,-.6); scene.add(halo);

/* ---------- 조명 ---------- */
scene.add(new THREE.AmbientLight(0x2a1d16,.55));
for(let i=0;i<6;i++){const a=i/6*Math.PI*2;const l=new THREE.PointLight(0xffb27a,.42,15,2);l.position.set(Math.cos(a)*(R-1.2),WALL_H-.5,Math.sin(a)*(R-1.2));scene.add(l);}

/* ---------- 반가사유상 (임시 형상: 실제 3D 스캔으로 교체 예정) ---------- */
function bronze(c,rough){return new THREE.MeshStandardMaterial({color:c,metalness:.62,roughness:rough});}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function limb(a,b,r1,r2,mat,g){const d=new THREE.Vector3().subVectors(b,a);const len=d.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,len,20,1),mat);
  m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(V(0,1,0),d.clone().normalize());g.add(m);
  const j=new THREE.Mesh(new THREE.SphereGeometry(r2,16,12),mat);j.position.copy(b);g.add(j);return m;}
function lathe(pts,mat,seg){return new THREE.Mesh(new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg||48),mat);}

function statue(kind){
  // kind 0: 낮은 삼산관, 상반신 나신 / kind 1: 높은 화려한 보관, 어깨 천의
  const g=new THREE.Group();
  const M=bronze(kind===0?0x7a6646:0x5a5440,kind===0?.38:.5);
  const D=bronze(kind===0?0x5e4c34:0x47443a,.55);
  // 연꽃 대좌와 둥근 의자
  const lotus=lathe([[0,0],[.2,0],[.23,.03],[.2,.05],[0,.05]],D);g.add(lotus);
  const stool=lathe([[0,.05],[.15,.05],[.12,.18],[.13,.3],[.165,.37],[.15,.39],[0,.39]],D);g.add(stool);
  // 의자를 덮어 흘러내리는 옷자락
  const drape=lathe([[.12,.07],[.215,.09],[.2,.2],[.185,.32],[.17,.4],[0,.42]],M,56);drape.scale.z=.85;g.add(drape);
  for(let i=0;i<7;i++){const a=-1.2+i*.4;const f=new THREE.Mesh(new THREE.BoxGeometry(.012,.26,.03),D);f.position.set(Math.sin(a)*.205,.22,Math.cos(a)*.18);f.rotation.y=a;g.add(f);}
  // 엉덩이·허리
  const hip=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),M);hip.scale.set(.15,.075,.12);hip.position.set(0,.44,0);g.add(hip);
  // 몸통: 가늘고 약간 앞으로 숙임
  const torso=new THREE.Group();torso.position.set(0,.45,0);torso.rotation.x=.16;g.add(torso);
  const body=lathe([[.0,0],[.105,0],[.085,.08],[.08,.16],[.1,.24],[.095,.28],[.045,.31],[0,.31]],M,40);body.scale.z=.72;torso.add(body);
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(.03,.034,.06,16),M);neck.position.y=.33;torso.add(neck);
  if(kind===0){const nl=new THREE.Mesh(new THREE.TorusGeometry(.065,.006,6,32,Math.PI),M);nl.rotation.set(Math.PI/2+.25,0,Math.PI);nl.position.set(0,.29,.025);nl.scale.y=.9;torso.add(nl);}
  // 머리: 고개를 살짝 숙임
  const head=new THREE.Group();head.position.set(0,.4,.01);head.rotation.x=.22;torso.add(head);
  const skull=new THREE.Mesh(new THREE.SphereGeometry(.066,28,22),M);skull.scale.set(.92,1.12,.98);head.add(skull);
  const nose=new THREE.Mesh(new THREE.ConeGeometry(.011,.03,8),M);nose.rotation.x=Math.PI/2;nose.position.set(0,-.005,.066);head.add(nose);
  for(const s of [-1,1]){const ear=new THREE.Mesh(new THREE.CylinderGeometry(.012,.01,.07,8),M);ear.position.set(s*.063,-.02,0);head.add(ear);}
  if(kind===0){
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(.05,.06,.035,24),M);cap.position.y=.07;head.add(cap);
    for(const x of [-.045,0,.045]){const p=new THREE.Mesh(new THREE.SphereGeometry(.028,16,10,0,Math.PI*2,0,Math.PI/2),M);p.scale.set(1,.9,.6);p.position.set(x,.085,0);head.add(p);}
  }else{
    const band=new THREE.Mesh(new THREE.CylinderGeometry(.064,.066,.03,24),D);band.position.y=.06;head.add(band);
    for(let i=0;i<9;i++){const a=(i/9)*Math.PI*2;const c=new THREE.Mesh(new THREE.ConeGeometry(.016,.07+(i%3===0?.05:0),6),M);c.position.set(Math.sin(a)*.055,.11,Math.cos(a)*.055);head.add(c);}
    const top=new THREE.Mesh(new THREE.CylinderGeometry(.03,.045,.08,16),M);top.position.y=.11;head.add(top);
    for(const s of [-1,1]){const rib=new THREE.Mesh(new THREE.BoxGeometry(.012,.12,.02),D);rib.position.set(s*.07,.01,-.01);rib.rotation.z=s*.15;head.add(rib);}
  }
  // 다리: 오른다리를 왼무릎 위에 올린 반가 자세 (상은 +z를 바라봄, 상의 오른쪽 = -x)
  const hipR=V(-.07,.45,.02), kneeR=V(-.24,.47,.15), ankleR=V(.08,.48,.18);
  limb(hipR,kneeR,.065,.055,M,g); limb(kneeR,ankleR,.05,.035,M,g);
  const footR=new THREE.Mesh(new THREE.BoxGeometry(.05,.03,.1),M);footR.position.set(.12,.47,.19);footR.rotation.y=-.6;g.add(footR);
  const hipL=V(.07,.44,.03), kneeL=V(.1,.42,.22), ankleL=V(.11,.08,.26);
  limb(hipL,kneeL,.065,.058,M,g);
  const shin=limb(kneeL,ankleL,.07,.06,M,g); // 옷자락에 덮인 정강이
  const footL=new THREE.Mesh(new THREE.BoxGeometry(.055,.03,.11),M);footL.position.set(.11,.07,.29);g.add(footL);
  // 팔: 오른팔꿈치를 무릎에 대고 손끝을 뺨에
  const T=v=>torso.localToWorld(v.clone());
  torso.updateMatrixWorld(true);g.updateMatrixWorld(true);
  const shR=T(V(-.105,.26,0)), shL=T(V(.105,.26,0));
  const elbR=V(-.2,.53,.13), handR=V(-.05,.84,.135);
  limb(shR,elbR,.033,.028,M,g); limb(elbR,handR,.028,.022,M,g);
  for(let i=0;i<3;i++){const f=new THREE.Mesh(new THREE.CylinderGeometry(.006,.007,.045,8),M);f.position.set(-.04+i*.01,.875,.14-i*.004);f.rotation.z=-.2;g.add(f);}
  const elbL=V(.15,.55,.06), handL=V(.08,.5,.2);
  limb(shL,elbL,.033,.028,M,g); limb(elbL,handL,.027,.024,M,g);
  const palmL=new THREE.Mesh(new THREE.BoxGeometry(.05,.015,.07),M);palmL.position.set(.07,.5,.22);g.add(palmL);
  if(kind===1){ // 천의 자락
    for(const s of [-1,1]){limb(T(V(s*.11,.27,-.02)),V(s*.2,.2,-.05),.012,.02,D,g);limb(V(s*.2,.2,-.05),V(s*.24,.02,-.02),.02,.035,D,g);}
  }
  g.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false;}});
  g.scale.setScalar(1.05);
  return g;
}

const statues=[];
function place(kind,x,z){
  const grp=new THREE.Group();grp.position.set(x,0,z);
  const ped=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,1.12,48),new THREE.MeshStandardMaterial({color:0x0b0908,roughness:.75}));
  ped.position.y=.1+.56;grp.add(ped);
  const s=statue(kind);s.position.y=1.22;grp.add(s);
  scene.add(grp);
  const spot=new THREE.SpotLight(0xffeedd,3.4,10,.32,.65,1);
  spot.position.set(x*.6,WALL_H-.1,z+2.4);spot.target.position.set(x,1.75,z);scene.add(spot,spot.target);
  const back=new THREE.SpotLight(0xffc690,1.1,8,.45,.8,1.2);
  back.position.set(x*1.4,WALL_H-.2,z-3);back.target.position.set(x,1.6,z);scene.add(back,back.target);
  statues.push({grp,x,z});
}
place(1,-1.75,-.75);   // 왼쪽: 높은 보관
place(0, 1.75,-.75);   // 오른쪽: 삼산관

const experience=createSayuExperience({THREE,canvas,camera,statues,radius:R,starBrightness:starMat.uniforms.uB});

/* ---------- 루프 ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?72:60;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  experience.update(now,dt);
  starMat.uniforms.uT.value=now/1000;
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
