# 정원 화면과 함께 걷기 서버를 memorygarden 한 Worker로 배포한다.
# 저장소 루트에서: npx wrangler deploy
name = "memorygarden"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/room/*", "/health"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GardenRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GardenRoom"]
