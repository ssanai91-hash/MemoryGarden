# 과거 분리형 방 서버 설정. 현재 운영 정원은 루트 wrangler.toml을 사용한다.
# 통합 배포: 저장소 루트에서 `npx wrangler deploy`
name = "memorygarden-rooms"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GardenRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GardenRoom"]

[vars]
# 정원 사이트 주소만 접속을 허용하려면 쉼표로 적는다. 비우면 모든 출처 허용.
# 예: "https://memorygarden.pages.dev,https://garden.example.com"
ALLOWED_ORIGINS = ""
